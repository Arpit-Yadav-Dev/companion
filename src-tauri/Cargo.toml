[package]
name = "companion"
version = "0.1.0"
description = "Companion — desktop mascot reminder app"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-store = "2.5.0"
chrono = { version = "0.4.45", features = ["serde"] }
anyhow = "1.0.104"
tokio = { version = "1.53.2", features = ["sync", "time"] }
tauri-plugin-dialog = "2.8.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# rustls rather than the system TLS stack: one less native dependency to
# get wrong per platform, which matters for the planned Windows build.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# macOS-only: NSWindow collection behaviour for the overlay (brief 2.1).
# Both are already in the tree via tauri, so this pins rather than adds.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSView"] }
